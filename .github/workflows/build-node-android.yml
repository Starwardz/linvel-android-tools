# Build Node.js for Android (aarch64, bionic)
#
# Builds a standalone `node` + `npm` that RUNS on Android (bionic libc),
# for Coder V2 / Linvel IDE. The official linux-arm64 downloads are glibc
# and cannot run on Android, so this builds from source with the NDK.
#
# Recipe: upstream Node `android-configure` + NDK r28c, API 24, arm64,
# --with-intl=small-icu, --v8-disable-temporal-support (removes the Rust
# requirement for Node 26), 16 KB page alignment.
# Run it: Actions tab -> this workflow -> Run workflow.
# Output: artifact `node-26.12.1-android-arm64` (a .zip with bin/node,
# bin/npm, lib/node_modules, and libc++_shared.so).

name: Build Node.js for Android (aarch64)

on:
  workflow_dispatch:

env:
  NODE_VERSION: "26.12.1"
  NDK_VERSION: "r28c"
  ANDROID_API: "24"

jobs:
  build-node-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space (standard runners only have 14 GB)
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/lib/jvm
          sudo apt-get clean
          df -h

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 ninja-build \
            pkg-config file binutils curl xz-utils zip

      - name: Download Android NDK r28c
        run: |
          set -euo pipefail
          cd "$HOME"
          curl -sSLO "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q "android-ndk-${NDK_VERSION}-linux.zip"
          ls "$HOME/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"

      - name: Download Node.js source
        run: |
          set -euo pipefail
          curl -sSLO "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}.tar.xz"
          tar xf "node-v${NODE_VERSION}.tar.xz"
          ls "node-v${NODE_VERSION}/android-configure"

      - name: Configure and build Node for Android
        # v8: shim also defines __cpp_lib_atomic_ref. v7 died at 47:28
        # on `no member named 'atomic_base64_to_binary_safe' in namespace
        # 'simdutf'` (V8 calls simdutf's atomic base64 functions for
        # shared TypedArrays). Root cause: simdutf.h gates those
        # declarations on `#if __cpp_lib_atomic_ref >= 201806L`, and the
        # NDK's libc++ has that macro commented out — the v5 shim defined
        # the std::atomic_ref class but not the macro, so the declarations
        # never appeared. The shim now defines the macro too (only when
        # the STL lacks it). The NDK's <atomic> never mentions atomic_ref,
        # so defining the macro is safe, and simdutf.h is the only file
        # in the tree that checks it.
        # v7: libcpufeatures. v6 died at 9:39 linking the target
        # openssl-cli: `ld.lld: error: undefined symbol:
        # android_getCpuFeatures`, referenced by Node's bundled zlib
        # (deps/zlib/cpu_features.c calls it on Android aarch64). Nothing
        # in the build provides it — the NDK ships cpufeatures as source
        # only (sources/android/cpufeatures/cpu-features.c), no prebuilt
        # lib. Fix: compile it to libcpufeatures.a in this step and add
        # -L$PWD -lcpufeatures to LDFLAGS (target links only — the
        # generated Makefiles map LDFLAGS to LDFLAGS.target, so host
        # links never see it). The same symbol is needed by the node
        # binary itself (it links libzlib.a too), so this covers that
        # link as well.
        # v6: build the HOST tools with the system compiler (CC_host=gcc,
        # CXX_host=g++). v5 died at 5:58 in step 6 on
        # `deps/v8/src/base/debug/stack_trace_posix.cc: use of undeclared
        # identifier 'backtrace'` (and backtrace_symbols /
        # backtrace_symbols_fd). Root cause, proven from the log + the
        # NDK headers: GYP defaults CC_host/CXX_host to CC/CXX, i.e. the
        # NDK cross-compiler, so the HOST build compiled against bionic
        # headers. That file is host-only (v8.gyp lists it under
        # OS=="linux") and it calls backtrace(), but bionic's
        # <execinfo.h> only declares backtrace() at API 33+ — we build
        # at API 24, so the declarations are hidden. With the system
        # compiler the host build uses glibc, which has real
        # backtrace()/execinfo.h. Second reason the same fix matters:
        # host tools (mksnapshot, torque) must RUN on the x86_64 runner,
        # so they must be x86_64 binaries — built with the NDK compiler
        # they would be aarch64 and could never execute. Target compiles
        # are untouched: CC/CXX still point at the NDK, and the
        # atomic_ref shim (v5) still applies there via CXXFLAGS.
        # v5: std::atomic_ref shim. v4 got into real compiling, then died
        # on `no member named 'atomic_ref' in namespace 'std'` (V8's
        # deps/v8/src/base/atomicops.h). Root cause, proven by direct
        # experiment with NDK r28c: the NDK's libc++ deliberately omits
        # std::atomic_ref — its __cpp_lib_atomic_ref macro is commented
        # out in <version> and there is no __atomic/atomic_ref.h — even
        # with -std=gnu++20. V8 uses it in 10 files, so patching one file
        # is not enough. Fix: a shim header (base64 below, decoded here)
        # that defines std::atomic_ref ONLY when the STL lacks it, as a
        # thin wrapper over std::atomic<T> — the approach V8 itself used
        # before atomic_ref. It is force-included into every C++ compile
        # with -include, via CXXFLAGS (target compiles) AND CXXFLAGS_host
        # (host compiles — the GYP makefiles read them separately, and
        # the first failure was a host compile). On a toolchain that
        # already has atomic_ref the shim is an empty no-op.
        # android-configure is used only for its patch step; CC/CXX/
        # GYP_DEFINES are exported here verbatim from android_configure.py.
        run: |
          set -euo pipefail
          export NDK="$HOME/android-ndk-${NDK_VERSION}"
          cd "node-v${NODE_VERSION}"
          echo "" | base64 -d > atomic_ref_shim.h
          test -s atomic_ref_shim.h || { echo "FAIL: shim did not decode"; exit 1; }
          grep -q "class atomic_ref" atomic_ref_shim.h || { echo "FAIL: shim content bad"; exit 1; }
          ./android-configure patch
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"
          export CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang++"
          export CC_host=gcc
          export CXX_host=g++
          export GYP_DEFINES="target_arch=arm64 v8_target_arch=arm64 android_target_arch=arm64 host_os=linux OS=android android_ndk_path=$NDK"
          aarch64-linux-android${ANDROID_API}-clang -c \
            "$NDK/sources/android/cpufeatures/cpu-features.c" -o cpu-features.o
          llvm-ar rcs libcpufeatures.a cpu-features.o
          test -s libcpufeatures.a || { echo "FAIL: libcpufeatures.a not built"; exit 1; }
          ./configure --dest-cpu=arm64 --dest-os=android --cross-compiling \
            --openssl-no-asm --with-intl=small-icu --v8-disable-temporal-support \
            --prefix="$PWD/staging"
          grep -q "CXX.host ?= g++" out/Makefile || { echo "FAIL: host compiler is not g++"; exit 1; }
          grep -q "CXX.target ?= .*/aarch64-linux-android" out/Makefile || { echo "FAIL: target compiler is not the NDK clang++"; exit 1; }
          LDFLAGS="-Wl,-z,max-page-size=16384 -L$PWD -lcpufeatures" CXXFLAGS="-include $PWD/atomic_ref_shim.h" CXXFLAGS_host="-include $PWD/atomic_ref_shim.h" make -j4
          ls -l out/Release/node

      - name: Verify the binary is bionic, not glibc
        # This is the gate. A glibc binary (interpreter /lib/ld-linux) cannot
        # run on Android. The job FAILS if the check fails.
        run: |
          set -euo pipefail
          cd "node-v${NODE_VERSION}"
          FILE_OUT="$(file out/Release/node)"
          echo "$FILE_OUT"
          case "$FILE_OUT" in
            *"/system/bin/linker64"*) echo "interpreter OK: bionic linker64" ;;
            *) echo "FAIL: node is not a bionic binary"; exit 1 ;;
          esac
          case "$FILE_OUT" in
            *"ld-linux"*) echo "FAIL: glibc-linked binary"; exit 1 ;;
          esac
          echo "--- NEEDED libraries ---"
          readelf -d out/Release/node | grep NEEDED
          echo "--- LOAD segment alignment (want 0x4000 for 16 KB pages) ---"
          readelf -lW out/Release/node | grep LOAD || true

      - name: Package node + npm + libc++_shared.so
        run: |
          set -euo pipefail
          export NDK="$HOME/android-ndk-${NDK_VERSION}"
          cd "node-v${NODE_VERSION}"
          python3 tools/install.py install --prefix "$PWD/staging" --build-dir out/Release
          test -x staging/bin/node || { echo "FAIL: no node in staging/bin"; exit 1; }
          test -f staging/bin/npm || { echo "FAIL: no npm in staging/bin"; exit 1; }
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" staging/lib/
          cat > staging/README-ANDROID.txt <<'EOF'
          Node.js 26.12.1 for Android aarch64 (bionic), built from source with NDK r28c, API 24.
          Contents: bin/node, bin/npm (+ bin/npx, bin/corepack), lib/node_modules, libc++_shared.so.
          The binary links libc++_shared.so: keep that file next to it (same dir as node,
          or set LD_LIBRARY_PATH to the dir holding it) or node will not start.
          On-device, ship node as an APK-native .so (Route C) — Android 10+ will not
          exec binaries from the app data dir.
          EOF
          ls -R staging/bin staging/lib | head -30
          (cd staging && zip -qr "$GITHUB_WORKSPACE/node-${NODE_VERSION}-android-arm64.zip" .)
          ls -lh "$GITHUB_WORKSPACE/node-${NODE_VERSION}-android-arm64.zip"
          du -sh "$GITHUB_WORKSPACE/node-${NODE_VERSION}-android-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-26.12.1-android-arm64
          path: node-26.12.1-android-arm64.zip
          retention-days: 90
