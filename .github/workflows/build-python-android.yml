# Build Python for Android (aarch64, bionic)
#
# Builds CPython 3.13.7 for Android aarch64 using CPython's own official
# Android support (Android/android.py in the CPython source tree). 3.13 is
# the first CPython line with official Android support; 3.12 and earlier
# needed third-party patches.
#
# Run it: Actions tab -> this workflow -> Run workflow.
# Output: artifact `python-3.13.7-android-arm64` (a .zip of the install
# prefix: bin/, lib/libpython*, and the stdlib).
#
# OPEN QUESTION this build answers (check the log): does prefix/bin contain
# a usable standalone `python` binary? Upstream Android support is designed
# for embedding libpython, not for a standalone CLI. The workflow prints a
# verdict block "STANDALONE PYTHON: YES/NO" — if NO, the fallback is a small
# launcher binary (same pattern as the JDK java-launcher), NOT a rebuild.

name: Build Python for Android (aarch64)

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13.7"
  NDK_VERSION: "28.2.13676358"

jobs:
  build-python-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free disk space (standard runners only have 14 GB)
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file binutils unzip zip \
            pkg-config libssl-dev zlib1g-dev libffi-dev libsqlite3-dev

      - name: Set up Java 17 (needed by the Android SDK manager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK + NDK 28.2.13676358
        run: |
          set -euo pipefail
          cd "$HOME"
          curl -sSLO "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          mkdir -p android-sdk/cmdline-tools
          unzip -q commandlinetools-linux-13114758_latest.zip -d android-sdk/cmdline-tools
          mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${NDK_VERSION}" "platform-tools"
          ls "$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

      - name: Download CPython source
        run: |
          set -euo pipefail
          curl -sSLO "https://www.python.org/ftp/python/${PYTHON_VERSION}/Python-${PYTHON_VERSION}.tgz"
          tar xf "Python-${PYTHON_VERSION}.tgz"
          ls "Python-${PYTHON_VERSION}/Android/android.py"

      - name: Build Python for Android (android.py does two builds)
        # android.py first builds a build-Python for the host, then the
        # host-Python for Android. Output: cross-build/aarch64-linux-android/prefix/
        # v2 FIX (run #1 failed: "./android.py: No such file or directory"):
        # the script lives at Android/android.py and is run from the Android
        # directory (per Android/README.md), not from the source root.
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          cd "Python-${PYTHON_VERSION}/Android"
          ./android.py build aarch64-linux-android
          cd ..
          echo "--- prefix tree ---"
          find cross-build/aarch64-linux-android/prefix -maxdepth 2 | sort

      - name: Verify the build + answer the standalone-binary question
        # Gate: the prefix must exist and contain libpython. The standalone
        # question is reported as a verdict, not a failure — a NO just means
        # the V2 side needs a launcher binary instead.
        run: |
          set -euo pipefail
          cd "Python-${PYTHON_VERSION}"
          PREFIX="cross-build/aarch64-linux-android/prefix"
          test -d "$PREFIX" || { echo "FAIL: no install prefix"; exit 1; }
          ls "$PREFIX/lib"/libpython* || { echo "FAIL: no libpython in prefix/lib"; exit 1; }
          echo "--- every file in prefix/bin ---"
          for f in "$PREFIX"/bin/*; do
            [ -e "$f" ] || continue
            echo "== $f"
            file "$f"
          done
          echo "--- standalone verdict ---"
          PYBIN=""
          for cand in "$PREFIX/bin/python3.13" "$PREFIX/bin/python3" "$PREFIX/bin/python"; do
            if [ -f "$cand" ]; then PYBIN="$cand"; break; fi
          done
          if [ -n "$PYBIN" ]; then
            OUT="$(file "$PYBIN")"
            echo "$OUT"
            case "$OUT" in
              *"aarch64"*"/system/bin/linker64"*) echo "STANDALONE PYTHON: YES ($PYBIN)" ;;
              *) echo "STANDALONE PYTHON: UNCLEAR — $PYBIN exists but is not a bionic aarch64 binary" ;;
            esac
          else
            echo "STANDALONE PYTHON: NO — no python binary in prefix/bin (launcher fallback needed)"
          fi
          echo "--- stdlib size ---"
          du -sh "$PREFIX/lib/python3.13" || du -sh "$PREFIX/lib"

      - name: Package the install prefix
        run: |
          set -euo pipefail
          cd "Python-${PYTHON_VERSION}/cross-build/aarch64-linux-android"
          cat > prefix/README-ANDROID.txt <<'EOF'
          CPython 3.13.7 for Android aarch64 (bionic), built with NDK 28.2.13676358, API 24.
          This is the install prefix: bin/ (python, if the standalone build produced one),
          lib/libpython3.13.so, and the stdlib under lib/python3.13/.
          On-device packaging (Route C): python as APK-native liblaura_python.so, libpython
          as a second .so if linked shared, stdlib as an R2 package with PYTHONHOME /
          PYTHONPATH pointing at it. See the build log verdict "STANDALONE PYTHON: YES/NO"
          for whether a launcher binary is needed.
          EOF
          zip -qr "$GITHUB_WORKSPACE/python-${PYTHON_VERSION}-android-arm64.zip" prefix
          ls -lh "$GITHUB_WORKSPACE/python-${PYTHON_VERSION}-android-arm64.zip"
          du -sh "$GITHUB_WORKSPACE/python-${PYTHON_VERSION}-android-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-3.13.7-android-arm64
          path: python-3.13.7-android-arm64.zip
          retention-days: 90
